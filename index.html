<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5;overflow-x:hidden}

.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}

#home h1{margin-top:4vh}
.ptabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.ptabs button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:600;backdrop-filter:blur(8px)}
.ptabs button.on{background:var(--c3);color:#111;border-color:transparent}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.st div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(8px)}

.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row2 small{color:var(--mute)}
.pill{display:inline-block;border:1px solid var(--c);color:var(--c);border-radius:999px;padding:0 10px;font-size:.8rem;margin-right:8px;font-weight:600}
.sl{display:block;color:var(--mute);margin:14px 0 6px;font-size:.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.chip.sel{background:var(--c,var(--c3));color:#111;border-color:transparent;font-weight:600}
#tp{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit}

</style>
