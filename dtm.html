<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DTM test — MStest</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ff;--ink:#14163a;--mute:#555880;--card:#fff;--line:#d6d3f3;--acc:#5a3df0;--accink:#fff;--c1:#12a36a;--c2:#1b8fd1;--c3:#c98400;--c4:#e0405c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f2e;--ink:#f1efff;--mute:#a9abd8;--card:#151a4a;--line:#2c3270;--acc:#9a86ff;--accink:#120c3a;--c1:#5ee0a0;--c2:#5cc8ff;--c3:#ffc857;--c4:#ff7a90}}
:root[data-theme="dark"]{--bg:#0b0f2e;--ink:#f1efff;--mute:#a9abd8;--card:#151a4a;--line:#2c3270;--acc:#9a86ff;--accink:#120c3a;--c1:#5ee0a0;--c2:#5cc8ff;--c3:#ffc857;--c4:#ff7a90}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--acc);text-decoration:none}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--acc),#06b6d4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.hbtn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:.86rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}
.hbtn.danger:hover{border-color:var(--c4);color:var(--c4)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.test-name{font-weight:800;font-size:1.15rem}
.meta{color:var(--mute);font-size:.86rem}
.timer{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:90px;text-align:center;transition:all .3s}
.timer.warn{border-color:var(--c3);color:var(--c3)}
.timer.danger{border-color:var(--c4);color:var(--c4);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.progress{height:8px;background:var(--card);border:1px solid var(--line);border-radius:100px;overflow:hidden;margin-bottom:22px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),#06b6d4);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin-bottom:16px}
.q-num{color:var(--mute);font-size:.86rem;font-weight:600;margin-bottom:8px}
.q-text{font-size:1.18rem;font-weight:600;line-height:1.5;margin-bottom:22px}
.option{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:all .2s;user-select:none}
.option:hover{border-color:var(--acc)}
.option.on{border-color:var(--acc);background:rgba(90,61,240,.06)}
.option.correct{border-color:var(--c1);background:rgba(18,163,106,.08)}
.option.wrong{border-color:var(--c4);background:rgba(224,64,92,.08)}
.option input{display:none}
.opt-key{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;transition:all .2s}
.option.on .opt-key{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.option.correct .opt-key{background:var(--c1);color:#fff;border-color:var(--c1)}
.option.wrong .opt-key{background:var(--c4);color:#fff;border-color:var(--c4)}
.opt-text{flex:1;padding-top:3px}
.explain{margin-top:14px;padding:14px;background:var(--bg);border-left:3px solid var(--c2);border-radius:8px;font-size:.9rem;color:var(--mute);line-height:1.5}
.explain b{color:var(--ink)}
.btns{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:12px;border:0;font:inherit;font-weight:700;font-size:.94rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--acc);color:var(--accink)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px -6px rgba(90,61,240,.5)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.result{text-align:center;padding:40px 24px}
.result-icon{font-size:4rem;margin-bottom:14px}
.result h1{font-size:2rem;font-weight:800;margin:0 0 8px}
.result p{color:var(--mute);margin:0 0 24px}
.score-big{font-size:4.5rem;font-weight:900;line-height:1;margin-bottom:8px;background:linear-gradient(135deg,var(--acc),#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.score-bar{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:100px;overflow:hidden;margin:20px 0}
.score-fill{height:100%;background:linear-gradient(90deg,var(--acc),#06b6d4);transition:width .8s ease-out}
.stats-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.stats-mini div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.stats-mini b{display:block;font-size:1.5rem;font-weight:800}
.stats-mini span{color:var(--mute);font-size:.82rem}
.loading{text-align:center;padding:80px 20px;color:var(--mute)}
.empty{text-align:center;padding:60px 20px;color:var(--mute)}
.theme-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hright{display:flex;gap:8px;align-items:center}
.q-text,.opt-text{overflow-wrap:anywhere}
.q-img{display:block;max-width:100%;max-height:340px;margin:0 auto 20px;border-radius:12px;background:#fff;padding:6px}
.part{margin-bottom:14px}
.part-q{margin-bottom:6px;font-weight:600;overflow-wrap:anywhere}
.part-in{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.part-in:focus{outline:0;border-color:var(--acc)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:.6em 0}
.katex{font-size:1.08em}
@media(max-width:600px){
  .q-text{font-size:1.05rem}
  .card{padding:20px 16px}
  .score-big{font-size:3.5rem}
}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:.88rem}
.chip.lock::after{content:"🔒";font-size:.8rem}
.pairs{display:grid;gap:8px;margin-top:10px}
.pair{padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;transition:all .2s}
.pair:hover{border-color:var(--acc)}
.pair.on{border-color:var(--acc);background:rgba(90,61,240,.07)}
.pair b{display:block}
.pair small{color:var(--mute)}
.pair.low small{color:var(--c3)}
.stabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.stab{flex:0 0 auto;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:.82rem;cursor:pointer;white-space:nowrap}
.stab.on{border-color:var(--acc);background:var(--acc);color:var(--accink)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.qg{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.qg.done{background:rgba(90,61,240,.15);border-color:var(--acc)}
.qg.cur{outline:2px solid var(--acc)}
details.nav{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
details.nav summary{cursor:pointer;font-weight:700}
.srow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.srow:last-child{border:0}
.tagx{display:inline-block;font-size:.78rem;font-weight:700;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.rv{border-left:4px solid var(--line)}
.rv.ok{border-left-color:var(--c1)}
.rv.bad{border-left-color:var(--c4)}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
</head>
<body>
<main>
  <header>
    <a href="index.html" class="logo"><div class="logo-icon">📝</div>MStest</a>
    <div class="hright">
      <button class="hbtn danger" id="quit">Chiqish</button>
      <button class="theme-btn" id="theme" title="Rang">🌙</button>
    </div>
  </header>
  <div id="app"><div class="loading">Yuklanmoqda...</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB = supabase.createClient(
  "https://mfxsbeajzfmpaswiaqac.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1meHNiZWFqemZtcGFzd2lhcWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTM5MjYsImV4cCI6MjEwNjk4OTkyNn0.iyTTA_Q-jKL0MjnVK4E8As_xGUkYONn_N5QaTWOZYp4"
);
const $ = id => document.getElementById(id);
const AB = ["A","B","C","D","E","F"];
const app = $("app");

let CFG = null, userId = null, selPair = null;
let ATT = null, QS = [], SUBJ = [], idx = 0, ANS = {}, endAt = 0, timerId = null, finishing = false, active = false;
const KEY = "dtm_active";

// ====== DARK MODE ======
$("theme").onclick = () => {
  const r = document.documentElement;
  const d = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  const t = d ? "light" : "dark";
  r.dataset.theme = t;
  $("theme").textContent = t === "dark" ? "☀️" : "🌙";
  try { localStorage.setItem("theme", t); } catch (e) {}
};
try {
  const t = localStorage.getItem("theme");
  if (t) { document.documentElement.dataset.theme = t; $("theme").textContent = t === "dark" ? "☀️" : "🌙"; }
  else if (matchMedia("(prefers-color-scheme:dark)").matches) $("theme").textContent = "☀️";
} catch (e) {}

// ====== FORMULALAR ======
function renderMath(el) {
  if (typeof renderMathInElement !== "function") return;
  try {
    renderMathInElement(el || app, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false });
  } catch (e) {}
}
window.addEventListener("load", () => renderMath(app));

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const fmt = n => String(n).replace(".", ",");
function fmtTime(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function say(text, href, label) {
  app.innerHTML = '<div class="empty">' + escapeHtml(text) + (href ? '<br><br><a class="btn primary" href="' + href + '">' + label + '</a>' : "") + '</div>';
}

$("quit").onclick = () => {
  if (active && !confirm("DTM testdan chiqmoqchimisiz? Test davom etaveradi, qaytib kirib davom ettirishingiz mumkin.")) return;
  location.href = "index.html";
};
window.addEventListener("beforeunload", e => { if (active) { e.preventDefault(); e.returnValue = ""; } });

// ====== YUKLASH ======
(async () => {
  const { data: { session } } = await SB.auth.getSession();
  userId = session?.user?.id || null;
  const { data, error } = await SB.rpc("dtm_config");
  if (error) return say("Xato: " + error.message);
  CFG = data;
  renderStart();
})();

function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    return s && s.uid === userId ? s : null;
  } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ uid: userId, att: ATT, endAt, ans: ANS, idx })); } catch (e) {}
}

// ====== BOSHLANGICH OYNA ======
function renderStart() {
  const s = CFG.settings, req = CFG.required, pairs = CFG.pairs;
  const total = req.length * s.req_count + 2 * s.elec_count;
  const maxScore = req.length * s.req_count * s.req_points + s.elec_count * (s.elec1_points + s.elec2_points);
  const saved = loadSaved();

  if (!req.length || !pairs.length) {
    return say("DTM test hali sozlanmagan. Tez orada qoʻshiladi.");
  }
  const reqLow = req.filter(r => r.pool < s.req_count);

  app.innerHTML = `
    <div class="card">
      <h1 style="margin:0 0 6px;font-size:1.6rem">🎓 DTM test</h1>
      <p class="meta" style="margin:0 0 14px">${total} ta savol · ${fmt(Math.round(s.minutes / 6) / 10)} soat · maksimal ${fmt(maxScore)} ball. Savollar har safar tasodifiy tanlanadi va takrorlanmasdan aylanib keladi.</p>

      <div class="q-num">Majburiy fanlar (avtomatik tanlangan)</div>
      <div class="chips">${req.map(r => `<span class="chip lock">${escapeHtml((r.icon || "") + " " + r.name)} · ${s.req_count} ta</span>`).join("")}</div>
      ${reqLow.length ? `<p class="meta" style="color:var(--c3)">Diqqat: ${reqLow.map(r => escapeHtml(r.name)).join(", ")} fanida savollar hali yetarli emas.</p>` : ""}

      <div class="q-num" style="margin-top:18px">Mutaxassislik fanlari juftligini tanlang (${s.elec_count} tadan)</div>
      <div class="pairs" id="pairs">
        ${pairs.map(p => {
          const low = p.a.pool < s.elec_count || p.b.pool < s.elec_count;
          return `<div class="pair ${low ? "low" : ""} ${selPair === p.id ? "on" : ""}" data-id="${p.id}">
            <b>${escapeHtml((p.a.icon || "") + " " + p.a.name)} + ${escapeHtml((p.b.icon || "") + " " + p.b.name)}</b>
            <small>1-fan: ${fmt(s.elec1_points)} ball, 2-fan: ${fmt(s.elec2_points)} ball${low ? " · savollar hali toʻliq emas" : ""}</small>
          </div>`;
        }).join("")}
      </div>
    </div>
    <div class="btns">
      ${saved ? '<button class="btn ghost" id="resume">▶️ Boshlangan testni davom ettirish</button>' : "<span></span>"}
      ${userId ? '<button class="btn primary" id="start" ' + (selPair ? "" : "disabled") + '>Testni boshlash</button>'
               : '<a class="btn primary" href="kirish.html?next=dtm.html">Boshlash uchun kiring</a>'}
    </div>`;

  document.querySelectorAll(".pair").forEach(el => {
    el.onclick = () => { selPair = +el.dataset.id; renderStart(); };
  });
  const st = $("start");
  if (st) st.onclick = startExam;
  const rs = $("resume");
  if (rs) rs.onclick = () => resumeExam(saved);
}

async function startExam() {
  if (!selPair) return;
  const btn = $("start"); btn.disabled = true; btn.textContent = "Tayyorlanmoqda...";
  const { data, error } = await SB.rpc("dtm_start", { p_pair_id: selPair });
  if (error) { btn.disabled = false; btn.textContent = "Testni boshlash"; return alert("Xato: " + error.message); }
  ATT = data; idx = 0; ANS = {};
  endAt = Date.now() + data.minutes * 60000;
  prepare();
  save();
  active = true;
  tick(); timerId = setInterval(tick, 1000);
  renderExam();
}

function resumeExam(saved) {
  ATT = saved.att; ANS = saved.ans || {}; idx = saved.idx || 0; endAt = saved.endAt;
  prepare();
  active = true;
  if (endAt <= Date.now()) return finishExam(true);
  tick(); timerId = setInterval(tick, 1000);
  renderExam();
}

function prepare() {
  QS = []; SUBJ = [];
  ATT.subjects.forEach((s, si) => {
    SUBJ.push({ name: s.name, icon: s.icon, start: QS.length, count: s.questions.length, points: s.points });
    s.questions.forEach(q => QS.push({ ...q, si }));
  });
}

// ====== TAYMER ======
function tick() {
  const left = Math.round((endAt - Date.now()) / 1000);
  const el = $("timer");
  if (el) {
    el.textContent = "⏱️ " + fmtTime(left);
    el.className = "timer" + (left < 300 ? " danger" : left < 900 ? " warn" : "");
  }
  if (left <= 0 && !finishing) finishExam(true);
}

// ====== IMTIHON ======
function subjOf(i) { return QS[i].si; }
function renderExam() {
  const q = QS[idx], si = q.si, S = SUBJ[si];
  const answered = Object.keys(ANS).length;
  app.innerHTML = `
    <div class="top">
      <div><div class="test-name">🎓 DTM test</div><div class="meta">${answered} / ${QS.length} javob berildi</div></div>
      <div class="timer" id="timer">⏱️</div>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${answered / QS.length * 100}%"></div></div>

    <div class="stabs">
      ${SUBJ.map((s, i) => {
        const done = QS.slice(s.start, s.start + s.count).filter(x => ANS[x.id] != null).length;
        return `<button class="stab ${i === si ? "on" : ""}" data-s="${i}">${escapeHtml((s.icon || "") + " " + s.name)} ${done}/${s.count}</button>`;
      }).join("")}
    </div>

    <div class="card">
      <div class="q-num">Savol ${idx + 1} / ${QS.length} · ${escapeHtml(S.name)} · ${fmt(S.points)} ball</div>
      <div class="q-text">${escapeHtml(q.body)}</div>
      ${q.image_url ? `<img class="q-img" src="${escapeHtml(q.image_url)}" alt="Chizma">` : ""}
      <div id="options">
        ${(q.options || []).map((opt, i) => `
          <div class="option ${ANS[q.id] === i ? "on" : ""}" data-i="${i}">
            <div class="opt-key">${AB[i]}</div><div class="opt-text">${escapeHtml(opt)}</div>
          </div>`).join("")}
      </div>
    </div>

    <div class="btns" style="margin-bottom:14px">
      <button class="btn ghost" id="prev" ${idx === 0 ? "disabled" : ""}>← Oldingi</button>
      <button class="btn ghost" id="next" ${idx === QS.length - 1 ? "disabled" : ""}>Keyingi →</button>
    </div>

    <details class="nav"><summary>Savollar xaritasi</summary>
      <div class="qgrid">${QS.map((x, i) => `<button class="qg ${ANS[x.id] != null ? "done" : ""} ${i === idx ? "cur" : ""}" data-g="${i}">${i + 1}</button>`).join("")}</div>
    </details>
    <div class="btns"><span></span><button class="btn primary" id="finish">✅ Testni yakunlash</button></div>`;

  document.querySelectorAll("#options .option").forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.i;
      ANS[q.id] = i; save();
      renderExam();
    };
  });
  document.querySelectorAll(".stab").forEach(b => { b.onclick = () => { idx = SUBJ[+b.dataset.s].start; save(); renderExam(); }; });
  document.querySelectorAll(".qg").forEach(b => { b.onclick = () => { idx = +b.dataset.g; save(); renderExam(); window.scrollTo(0, 0); }; });
  $("prev").onclick = () => { idx--; save(); renderExam(); window.scrollTo(0, 0); };
  $("next").onclick = () => { idx++; save(); renderExam(); window.scrollTo(0, 0); };
  $("finish").onclick = () => finishExam(false);
  tick();
  renderMath(app);
}

// ====== YAKUNLASH ======
async function finishExam(auto) {
  if (finishing) return;
  if (!auto) {
    const left = QS.length - Object.keys(ANS).length;
    if (!confirm(left ? "Hali " + left + " ta savolga javob berilmagan. Baribir yakunlaysizmi?" : "Testni yakunlaysizmi?")) return;
  }
  finishing = true;
  if (timerId) clearInterval(timerId);
  app.innerHTML = '<div class="loading">Natija hisoblanmoqda...</div>';
  const payload = QS.map(q => ({ question_id: q.id, chosen_index: ANS[q.id] != null ? ANS[q.id] : null }));
  const { data, error } = await SB.rpc("dtm_finish", { p_attempt_id: ATT.attempt_id, p_answers: payload });
  if (error) {
    finishing = false;
    app.innerHTML = '<div class="empty">Xato: ' + escapeHtml(error.message) + '<br><br><button class="btn primary" id="retry">Qayta urinish</button></div>';
    $("retry").onclick = () => finishExam(true);
    return;
  }
  active = false;
  try { localStorage.removeItem(KEY); } catch (e) {}
  renderResult(data);
}

function renderResult(R) {
  const pct = R.max_score ? Math.round(R.score / R.max_score * 100) : 0;
  app.innerHTML = `
    <div class="card result">
      <div class="result-icon">${pct >= 70 ? "🏆" : pct >= 40 ? "👍" : "💪"}</div>
      <h1>${pct >= 70 ? "Ajoyib natija!" : pct >= 40 ? "Yaxshi urinish!" : "Mashq qilishda davom eting"}</h1>
      <div class="score-big">${fmt(R.score)}</div>
      <p>${fmt(R.max_score)} balldan · ${R.correct} / ${R.total} ta toʻgʻri javob</p>
      <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
      <div style="text-align:left">
        ${R.subjects.map(s => `<div class="srow"><span>${escapeHtml((s.icon || "") + " " + s.name)}</span><b>${fmt(s.score)} / ${fmt(s.max)} · ${s.correct}/${s.total}</b></div>`).join("")}
      </div>
    </div>
    <div class="btns">
      <button class="btn ghost" id="again">🔁 Yangi DTM test</button>
      <button class="btn primary" id="review">🔍 Xatolarni koʻrish</button>
    </div>
    <div id="rv" style="margin-top:18px"></div>`;
  $("again").onclick = () => { selPair = null; renderStart(); };
  $("review").onclick = () => renderReview(R, true);
}

function renderReview(R, onlyWrong) {
  const byId = {}; R.results.forEach(r => { byId[r.question_id] = r; });
  const list = QS.map((q, i) => ({ q, i, r: byId[q.id] || {} })).filter(x => !onlyWrong || !x.r.is_correct);
  $("rv").innerHTML = `
    <div class="btns" style="margin-bottom:12px">
      <b>${onlyWrong ? "Xato va javobsiz savollar" : "Barcha savollar"} (${list.length})</b>
      <button class="btn ghost" id="tgl">${onlyWrong ? "Hammasini koʻrsatish" : "Faqat xatolar"}</button>
    </div>` + (list.length ? list.map(({ q, i, r }) => {
      const user = ANS[q.id];
      return `<div class="card rv ${r.is_correct ? "ok" : "bad"}">
        <span class="tagx">${i + 1}-savol · ${escapeHtml(SUBJ[q.si].name)}</span>
        <div class="q-text" style="font-size:1.02rem">${escapeHtml(q.body)}</div>
        ${q.image_url ? `<img class="q-img" src="${escapeHtml(q.image_url)}" alt="Chizma">` : ""}
        ${(q.options || []).map((opt, j) => `<div class="option ${j === r.correct_index ? "correct" : (j === user ? "wrong" : "")}" style="cursor:default;margin-bottom:6px">
          <div class="opt-key">${AB[j]}</div><div class="opt-text">${escapeHtml(opt)}</div></div>`).join("")}
        ${user == null ? '<div class="explain">Javob berilmagan.</div>' : ""}
        ${r.explanation ? `<div class="explain"><b>Izoh:</b> ${escapeHtml(r.explanation)}</div>` : ""}
      </div>`;
    }).join("") : '<div class="empty">Xato yoʻq. Barakalla! 🎉</div>');
  $("tgl").onclick = () => renderReview(R, !onlyWrong);
  renderMath($("rv"));
  $("rv").scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
</body>
