<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yangi parol — MStest</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.wrap{width:100%;max-width:440px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px;box-shadow:var(--shadow-lg);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;color:var(--ink);margin-bottom:20px}
.logo-icon{width:38px;height:38px;background:var(--accent-grad);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 12px rgba(45,95,255,.4)}
h1{font-size:1.4rem;font-weight:800;margin:0 0 6px}
.sub{color:var(--ink-soft);font-size:.92rem;margin:0 0 24px}
label{display:block;font-size:.88rem;color:var(--ink-soft);margin:14px 0 6px;font-weight:600}
input{width:100%;padding:13px 14px;background:var(--bg-soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;font:inherit;font-size:.95rem;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(45,95,255,.15)}
.msg{margin-top:14px;padding:11px 14px;border-radius:11px;font-size:.9rem;font-weight:600;display:none}
.msg.on{display:block}
.msg.ok{background:rgba(16,185,129,.12);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.msg.err{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
</style>
</head>
<body>

<div class="bg-wrap">
  <div class="bg-gradient"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="particles" id="particles"></div>
</div>

<button class="theme-btn" id="theme" title="Mavzu">🌙</button>

<div class="wrap">
  <div class="card">
    <div class="logo"><div class="logo-icon">📝</div>MStest</div>
    <h1>Yangi parol</h1>
    <p class="sub">Yangi parolingizni kiriting</p>

    <form id="form">
      <label for="p1">Yangi parol</label>
      <input type="password" id="p1" placeholder="••••••••" minlength="6" required>

      <label for="p2">Parolni tasdiqlang</label>
      <input type="password" id="p2" placeholder="••••••••" minlength="6" required>

      <button type="submit" class="btn3d" style="width:100%;margin-top:22px" id="btn">Saqlash</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB = supabase.createClient(
  "https://mfxsbeajzfmpaswiaqac.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1meHNiZWFqemZtcGFzd2lhcWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTM5MjYsImV4cCI6MjEwNjk4OTkyNn0.iyTTA_Q-jKL0MjnVK4E8As_xGUkYONn_N5QaTWOZYp4"
);
const $ = id => document.getElementById(id);

// Zarrachalar
(function(){
  const box = $("particles"); if (!box) return;
  for (let i = 0; i < 25; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random()*100+"%";
    p.style.animationDuration = (10+Math.random()*15)+"s";
    p.style.animationDelay = (Math.random()*15)+"s";
    const s = 2+Math.random()*3;
    p.style.width = p.style.height = s+"px";
    box.appendChild(p);
  }
})();

// Tema
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("theme").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("theme",t)}catch(e){}}
$("theme").onclick = () => applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
(function(){let t;try{t=localStorage.getItem("theme")}catch(e){};if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";applyTheme(t)})();

// Xabar
function showMsg(t, type){ $("msg").textContent = t; $("msg").className = "msg on " + type; }

// Parolni yangilash
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const p1 = $("p1").value, p2 = $("p2").value;
  if (p1 !== p2) return showMsg("Parollar mos emas.", "err");
  if (p1.length < 6) return showMsg("Parol kamida 6 belgi.", "err");

  $("btn").disabled = true;
  $("btn").textContent = "Saqlanmoqda...";

  const { error } = await SB.auth.updateUser({ password: p1 });

  $("btn").disabled = false;
  $("btn").textContent = "Saqlash";

  if (error) return showMsg(error.message, "err");

  showMsg("Parol yangilandi! Yo‘naltirilmoqda...", "ok");
  setTimeout(() => location.href = "kirish.html", 1200);
};
</script>
</body>
</html>
