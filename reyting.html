<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reyting — MStest</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ff;--ink:#14163a;--mute:#555880;--card:#fff;--line:#d6d3f3;--acc:#5a3df0;--accink:#fff;--gold:#f5b400;--silver:#a8b0c0;--bronze:#c98c4a;--c1:#12a36a;--c4:#e0405c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f2e;--ink:#f1efff;--mute:#a9abd8;--card:#151a4a;--line:#2c3270;--acc:#9a86ff;--accink:#120c3a}}
:root[data-theme="dark"]{--bg:#0b0f2e;--ink:#f1efff;--mute:#a9abd8;--card:#151a4a;--line:#2c3270;--acc:#9a86ff;--accink:#120c3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;color:var(--acc);text-decoration:none}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--acc),#06b6d4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.hbtn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}
.hbtn.primary{background:var(--acc);color:var(--accink);border-color:transparent}
.hbtn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px -6px rgba(90,61,240,.5)}
h1{font-size:1.7rem;font-weight:800;margin:0 0 6px}
.subtitle{color:var(--mute);font-size:1rem;margin:0 0 24px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter{padding:8px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-weight:600;font-size:.86rem;cursor:pointer;transition:all .2s}
.filter:hover{border-color:var(--acc)}
.filter.on{background:var(--acc);color:var(--accink);border-color:transparent}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px}
@media(max-width:640px){.podium{grid-template-columns:1fr}}
.pod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 16px;text-align:center;position:relative;transition:all .3s}
.pod:hover{transform:translateY(-4px);box-shadow:0 15px 35px -12px rgba(90,61,240,.25)}
.pod.first{border-color:var(--gold);background:linear-gradient(180deg,rgba(245,180,0,.08),var(--card));order:2;transform:scale(1.05)}
